[project]
name = "mor"
version = "0.1.0"
description = "Merchant of record for Southeast Asian sellers."
requires-python = ">=3.14"
dependencies = [
    "htpy>=26.5.1",
    "httpx2>=2.16.2",
    "msgspec>=0.22.0",
    "psycopg[binary]>=3.3.9",
    "segno>=1.6.6",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
    "weasyprint>=70.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# The shared baseline (~/Desktop/conventions/AGENTS.md).
# All of DTZ: timestamps are aware UTC. A: no shadowing of builtins (AGENTS.md,
# Code Style). TID251: the banned APIs below, each with its rule.
select = ["E", "F", "I", "UP", "B", "DTZ", "A", "TID251"]

[tool.ruff.lint.per-file-ignores]
# Vulture's whitelist format is bare attribute expressions.
"vulture_whitelist.py" = ["B018"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "No TYPE_CHECKING imports: move shared types to a third module."
"typing.TypedDict".msg = "Records are frozen dataclasses or msgspec structs (AGENTS.md)."
"pydantic".msg = "Records are frozen dataclasses or msgspec structs (AGENTS.md)."
"httpx".msg = "Outgoing HTTP uses httpx2 (AGENTS.md, decided 17-Nov-2026)."
"functools.partial".msg = "No partial-style indirection: call the function."
"psycopg.sql".msg = "No SQL composed at runtime: literal SQL with named placeholders."
"decimal.Decimal".msg = "Money is int minor units, rates are fractions.Fraction (AGENTS.md)."

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.pyright]
# scripts/ are PEP 723 scripts with their own dependencies; not part of the package.
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
reportMatchNotExhaustive = "error"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test files in different folders may share a basename (tests/x/test_store.py).
addopts = "--import-mode=importlib"
# So tests import shared helpers as `tests.helpers`.
pythonpath = ["."]

[dependency-groups]
dev = [
    "ast-grep-cli>=0.51.3",
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "vulture>=2.16",
]

[tool.vulture]
# src only: a name used only by tests is reported, then whitelisted with a
# reason if it is meant to stay.
paths = ["src", "vulture_whitelist.py"]
