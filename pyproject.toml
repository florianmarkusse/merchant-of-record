[project]
name = "mor"
version = "0.1.0"
description = "Merchant of record for Southeast Asian sellers."
requires-python = ">=3.14"
dependencies = [
    "htpy>=26.5.1",
    "httpx2>=2.16.2",
    "msgspec>=0.22.0",
    "psycopg[binary]>=3.3.9",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# The shared baseline (~/Desktop/conventions/AGENTS.md).
select = ["E", "F", "I", "UP", "B", "DTZ005", "DTZ011"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.pyright]
# scripts/ are PEP 723 scripts with their own dependencies; not part of the package.
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
reportMatchNotExhaustive = "error"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test files in different folders may share a basename (tests/x/test_store.py).
addopts = "--import-mode=importlib"
# So tests import shared helpers as `tests.helpers`.
pythonpath = ["."]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
