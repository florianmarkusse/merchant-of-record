id: asynccontextmanager-returns-asyncgenerator
language: python
severity: error
message: An @asynccontextmanager function returns AsyncGenerator[T] (shared conventions, Tooling).
# Our package and its tests; scripts/ has its own conventions (PEP 723).
files:
  - src/**/*.py
  - tests/**/*.py
rule:
  kind: decorated_definition
  all:
    - has:
        kind: decorator
        regex: asynccontextmanager
    - has:
        kind: function_definition
        not:
          has:
            field: return_type
            regex: ^AsyncGenerator\[
